<!doctype html>
<html lang="en">

<head>
	<title>Webleb</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
	<link rel="stylesheet" href="stryleLog.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
	<div class="section">
		<div class="container">
			<div class="row full-height justify-content-center">
				<div class="col-12 text-center align-self-center py-5">
					<div class="section pb-5 pt-5 pt-sm-2 text-center">
						<h6 class="mb-0 pb-3"><span>Log In </span><span>Sign Up</span></h6>
						<input class="checkbox" type="checkbox" id="reg-log" name="reg-log" />
						<label for="reg-log"></label>
						<div class="card-3d-wrap mx-auto">
							<div class="card-3d-wrapper">
								<div class="card-front">
									<div class="center-wrap">
										<div class="section text-center">
											<h4 class="mb-4 pb-3">Log In</h4>
											<div class="form-group">
											<input id="login-email" type="email" class="form-style" placeholder="Email" required>
											<i class="input-icon uil uil-at"></i>
										</div>
										<div class="form-group mt-2">
											<input id="login-password" type="password" class="form-style" placeholder="Password" required>
											<i class="input-icon uil uil-lock-alt"></i>
										</div>
										<div id="login-error" class="text-danger small mt-2" role="alert"></div>
										<button id="login-btn" type="button" class="btn mt-4">Login</button>
											<p class="mb-0 mt-4 text-center"><a href="#" class="link">Forgot your
													password?</a></p>
										</div>
									</div>
								</div>
								<div class="card-back">
									<div class="center-wrap">
										<div class="section text-center">
											<h4 class="mb-3 pb-3">Sign Up</h4>
											<div class="form-group">
											<input id="register-username" type="text" class="form-style" placeholder="Nome utente" required>
											<i class="input-icon uil uil-user"></i>
										</div>
										<div class="form-group mt-2">
											<input id="register-email" type="email" class="form-style" placeholder="Email" required>
											<i class="input-icon uil uil-at"></i>
										</div>
										<div class="form-group mt-2">
											<input id="register-password" type="password" class="form-style" placeholder="Password" required>
											<i class="input-icon uil uil-lock-alt"></i>
										</div>
										<div id="register-error" class="text-danger small mt-2" role="alert"></div>
										<button id="register-btn" type="button" class="btn mt-4">Register</button>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script>
	$(function () {
		function showError(target, message) {
			$(target).text(message).fadeIn();
		}

		function clearError(target) {
			$(target).text('').hide();
		}

		$('#login-btn').on('click', function (e) {
			e.preventDefault();
			clearError('#login-error');

			const email = $('#login-email').val().trim();
			const password = $('#login-password').val();

			if (!email || !password) {
				showError('#login-error', 'Inserisci email e password.');
				return;
			}

			$.ajax({
				url: 'login.php',
				type: 'POST',
				contentType: 'application/json',
				data: JSON.stringify({ email: email, password: password }),
				success: function (response) {
					if (response.success) {
						localStorage.setItem('loggedUserEmail', response.user.email);
						localStorage.setItem('loggedUsername', response.user.username);
						localStorage.setItem('loggedUserImg', 'https://via.placeholder.com/25');
						window.location.href = 'index.html';
					} else {
						showError('#login-error', response.message || 'Utente non trovato, devi registrarti!');
					}
				},
				error: function (xhr) {
					const response = xhr.responseJSON || {};
					showError('#login-error', response.message || 'Utente non trovato, devi registrarti!');
				}
			});
		});

		$('#register-btn').on('click', function (e) {
			e.preventDefault();
			clearError('#register-error');

			const username = $('#register-username').val().trim();
			const email = $('#register-email').val().trim();
			const password = $('#register-password').val();

			if (!username || !email || !password) {
				showError('#register-error', 'Compila tutti i campi per la registrazione.');
				return;
			}

			$.ajax({
				url: 'registrazione.php',
				type: 'POST',
				contentType: 'application/json',
				data: JSON.stringify({ username: username, email: email, password: password }),
				success: function (response) {
					if (response.success) {
						showError('#register-error', response.message || 'Registrazione completata.');
						$('#reg-log').prop('checked', false);
						$('#register-username, #register-email, #register-password').val('');
					} else {
						showError('#register-error', response.message || 'Registrazione non riuscita.');
					}
				},
				error: function (xhr) {
					const response = xhr.responseJSON || {};
					showError('#register-error', response.message || 'Registrazione non riuscita.');
				}
			});
		});
	});
	</script>
</body>

</html>
